name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Las migraciones corren en Node ANTES del deploy del Worker.
      # Usar el connection string directo (no pooled) de Neon para DDL.
      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}

      - name: Build and deploy to Cloudflare Workers
        # `--var SENTRY_DSN` es para `queue` y `scheduled` de `worker.ts`, que no
        # pasan por `next build` y no ven las `NEXT_PUBLIC_*` inlineadas.
        run: npm run deploy -- --var "SENTRY_DSN:$NEXT_PUBLIC_SENTRY_DSN"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Build-time: las NEXT_PUBLIC_* se inlinean en el bundle.
          NEXT_PUBLIC_META_APP_ID: ${{ vars.NEXT_PUBLIC_META_APP_ID }}
          NEXT_PUBLIC_META_CONFIG_ID: ${{ vars.NEXT_PUBLIC_META_CONFIG_ID }}
          NEXT_PUBLIC_WHATSAPP_CONFIG_ID: ${{ vars.NEXT_PUBLIC_WHATSAPP_CONFIG_ID }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          # Sentry solo reporta desde este build: `NEXT_PUBLIC_SENTRY_ENVIRONMENT`
          # es lo que lo enciende en navegador, servidor y edge. Staging y local
          # no lo tienen y quedan apagados aunque haya DSN.
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: production
          # Subida de source maps en `next build` (`withSentryConfig`). Sin el
          # token el build sigue y los stack traces salen minificados.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          # Solo para que `next build` tenga un valor presente; en runtime el
          # Worker usa el secreto configurado con `wrangler secret put`.
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
