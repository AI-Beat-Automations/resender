name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generated Cloudflare types
        run: |
          npm --workspace api run cf-typegen:check
          npm --workspace web run cf-typegen:check

      - name: Lint maintained sources
        run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Nonincremental typecheck
        run: |
          npm --workspace @workspace/contracts run typecheck -- --incremental false
          npm --workspace @workspace/ui run typecheck -- --incremental false
          npm --workspace api run typecheck -- --incremental false
          npm --workspace web run typecheck -- --incremental false

      - name: Test API and shared packages
        run: |
          npm --workspace @workspace/contracts run test:run
          npm --workspace api run test:run

      - name: Build API Worker
        run: npm --workspace api run build

      - name: Test and build web
        run: |
          npm --workspace web run test:run
          npm --workspace web run build
        env:
          AUTH_SECRET: ci-only-dummy-secret
          APP_URL: http://localhost:3000
          NEXT_PUBLIC_META_APP_ID: "0"
          NEXT_PUBLIC_META_CONFIG_ID: "0"

  # Empaqueta ambos Workers API-first, sin subir una versión web que quedaría
  # enlazada al API de producción ni afirmar una URL con preview_urls=false.
  preview:
    needs: ci
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dry-run API Worker first
        run: npm --workspace api run build

      - name: Package web Worker without upload
        run: |
          npm --workspace web exec -- opennextjs-cloudflare build
          npx wrangler deploy --dry-run --env="" --config apps/web/wrangler.jsonc --outdir .wrangler/preview-dry-run
        env:
          NEXT_PUBLIC_META_APP_ID: ${{ vars.NEXT_PUBLIC_META_APP_ID }}
          NEXT_PUBLIC_META_CONFIG_ID: ${{ vars.NEXT_PUBLIC_META_CONFIG_ID }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          APP_URL: https://resender.dev
