<!doctype html>
<html lang="es" dir="ltr" style="height:100%;">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>{{{INTRO}}}</title>
<style>
  /* Gmail, Apple Mail e iOS respetan <style> en <head>. Outlook de escritorio no,
     por eso TODO lo imprescindible va tambien inline en cada elemento. Lo de aqui
     son solo mejoras de movil.

     Colores: contrato semantico de packages/ui/src/styles/globals.css (ADR 0015),
     modo claro. Se copian como hex porque los clientes de correo no leen
     variables CSS:
       --background / --card      #ffffff
       --surface-sunken           #fafafa
       --foreground               #252525
       --text-secondary           #525252
       --muted-foreground         #767676
       --border                   #e5e5e5
       --border-subtle            #ececec
       --primary                  #7673a4
       --primary-soft             #eeedf6
       --primary-soft-border      #d9d7ea
       --primary-soft-foreground  #4d4a75
     Solo modo claro, como el sitio publico: el logo es texto oscuro sobre
     transparente y no se lee sobre un fondo oscuro. */
  html, body { height:100% !important; }
  body { margin:0 !important; padding:0 !important; width:100% !important; }
  table { border-collapse:collapse !important; }
  img { border:0; line-height:100%; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; }
  a { text-decoration:none; }

  @media only screen and (max-width:620px) {
    .rs-shell { width:100% !important; }
    .rs-pad   { padding-left:24px !important; padding-right:24px !important; }
    .rs-h1    { font-size:24px !important; line-height:32px !important; }
    .rs-btn a { display:block !important; }
    .rs-logo  { width:132px !important; height:24px !important; }
  }
</style>
</head>

<body style="margin:0; padding:0; height:100%; background-color:#fafafa;">

  <!-- Preheader: lo que se lee en la bandeja debajo del asunto. Los espacios
       invisibles evitan que el cliente rellene con el texto del cuerpo. -->
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all; font-size:1px; line-height:1px; color:#fafafa; opacity:0;">
    {{{PREHEADER}}}&#8203;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;&#847;
  </div>

  <!-- Centrado en los dos ejes: la tabla exterior ocupa todo el alto del
       visor (height=100% en html, body y tabla) y la celda alinea al medio.
       Gmail web mete el correo en su propio contenedor y solo aplica el
       centrado horizontal; el resto (Apple Mail, iOS, Outlook.com) centra
       tambien en vertical. -->
  <table role="presentation" width="100%" height="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; height:100%; min-height:100%; background-color:#fafafa;">
    <tr>
      <td align="center" valign="middle" style="padding:40px 12px;">

        <table role="presentation" class="rs-shell" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; margin:0 auto;">

          <!-- Marca. El alt lleva el nombre para que, si el cliente bloquea
               imagenes, siga apareciendo "Resender" arriba y el correo no se
               parezca a uno falsificado. -->
          <tr>
            <td align="center" style="padding:0 8px 24px 8px;">
              <a href="https://resender.dev" target="_blank" rel="noopener" style="display:inline-block; text-decoration:none;">
                <img class="rs-logo" src="https://pub-403f6797a0df42a3a50ebda7cedeedf0.r2.dev/dc9ec72b-4f7f-48a5-be9c-8597a44a3061_removalai_preview.png" width="152" height="28" alt="Resender" style="display:block; width:152px; height:28px; border:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:17px; font-weight:700; color:#252525;">
              </a>
            </td>
          </tr>

          <tr>
            <td style="background-color:#ffffff; border:1px solid #e5e5e5; border-radius:12px;">

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

                <tr>
                  <td class="rs-pad" style="padding:36px 40px 0 40px;">
                    <h1 class="rs-h1" style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:26px; line-height:34px; font-weight:700; letter-spacing:-0.02em; color:#252525;">{{{GREETING}}}</h1>
                  </td>
                </tr>

                <tr>
                  <td class="rs-pad" style="padding:14px 40px 0 40px;">
                    <p style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:24px; color:#525252;">{{{INTRO}}}</p>
                  </td>
                </tr>

                <!-- Boton. Sin VML de Outlook a proposito: el editor del dashboard
                     puede limpiar los comentarios condicionales, y perderlos deja
                     un boton roto en vez de uno con esquinas cuadradas. En Outlook
                     de escritorio se ve rectangular; en todo lo demas, redondeado. -->
                <tr>
                  <td class="rs-pad rs-btn" style="padding:28px 40px 0 40px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td align="center" bgcolor="#7673a4" style="background-color:#7673a4; border-radius:8px;">
                          <a href="{{{VERIFY_URL}}}" target="_blank" rel="noopener" style="display:inline-block; padding:13px 26px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; font-weight:600; line-height:20px; color:#ffffff; text-decoration:none; border-radius:8px;">{{{CTA_LABEL}}}</a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <tr>
                  <td class="rs-pad" style="padding:20px 40px 0 40px;">
                    <p style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:13px; line-height:20px; color:#767676;">{{{EXPIRY_NOTE}}}</p>
                  </td>
                </tr>

                <!-- La URL en texto: si el boton no se puede pulsar (cliente que
                     bloquea enlaces, correo reenviado, impreso) el enlace sigue
                     estando. word-break evita que rompa el ancho del correo.
                     Tinte suave del primario, como los chips de la consola. -->
                <tr>
                  <td class="rs-pad" style="padding:24px 40px 0 40px;">
                    <p style="margin:0 0 8px 0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; line-height:18px; color:#767676;">{{{FALLBACK_LABEL}}}</p>
                    <div style="padding:10px 12px; background-color:#eeedf6; border:1px solid #d9d7ea; border-radius:8px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; line-height:18px; color:#4d4a75; word-break:break-all;">{{{VERIFY_URL}}}</div>
                  </td>
                </tr>

                <tr>
                  <td class="rs-pad" style="padding:28px 40px 0 40px;">
                    <div style="height:1px; line-height:1px; font-size:0; background-color:#ececec;">&nbsp;</div>
                  </td>
                </tr>

                <tr>
                  <td class="rs-pad" style="padding:20px 40px 36px 40px;">
                    <p style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:13px; line-height:20px; color:#767676;">{{{IGNORE_NOTE}}}</p>
                  </td>
                </tr>

              </table>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:20px 8px 0 8px;">
              <p style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; line-height:18px; color:#767676;">{{{FOOTER_NOTE}}}</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
